site_name: Planner Cidade da Criança
site_description: Planner pedagógico integrado ao Dashboard de Visitas da Cidade da Criança de Fortaleza
site_author: Adriell Gomes

theme:
  name: material
  palette:
    - scheme: cidade-crianca
      primary: '#FAAE39'      # cor da barra superior / menu
      accent: '#23B4B6'       # cor de destaque (botões, links ativos)
      toggle:
        icon: material/weather-night
        name: Modo escuro
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top

extra_css:
  - css/extra.css

nav:
  - Início: index.md
  - Planner:
      - "01 - Capa": page01_capa.md
      - "02 - Apresentação, Missão, Visão e Valores": page02_apresentacao_com_missao_e_visao.md
      - "03 - Histórico": page03_historico.md
